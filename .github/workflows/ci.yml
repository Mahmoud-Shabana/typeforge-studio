name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v

  windows-exe:
    name: Package unsigned Windows exe
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging tool
        run: python -m pip install pyinstaller
      - name: Package
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TypeForgeStudio app.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypeForgeStudio-Windows-unsigned
          path: dist/TypeForgeStudio.exe
          if-no-files-found: error